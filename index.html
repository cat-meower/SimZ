<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SimZ</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}h1{margin:0}#bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}.control{display:flex;align-items:center;gap:7px}input[type=range]{width:130px}button{padding:7px 12px;border:1px solid #555;border-radius:6px;background:#222;color:#eee;cursor:pointer}canvas{background:#222;border:2px solid #555;border-radius:8px;max-width:95vw}.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px}.y{background:#ffd83d}.g{background:#35c759}.b{background:#4da3ff}.w{background:#777}
</style></head><body><h1>SimZ</h1><div id="bar"><button id="reset">Reset</button><button id="pause">Pause</button><label class="control">People <input id="count" type="range" min="1" max="300" value="45"><output id="countVal">45</output></label><label class="control">Infection chance <input id="chance" type="range" min="0" max="100" value="12"><output id="chanceVal">12%</output></label><label class="control">Defence <input id="defence" type="range" min="0" max="100" value="0"><output id="defenceVal">0%</output></label></div><canvas id="sim" width="900" height="600"></canvas><div class="legend"><span><i class="dot y"></i> healthy</span><span><i class="dot g"></i> infected zombie</span><span><i class="dot b"></i> defender</span><span><i class="dot w"></i> walls</span></div><div id="stats"></div><script src="sim.js"></script></body></html>
