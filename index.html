<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SimZ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#eee;font-family:Orbitron,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}h1{margin:0;font-size:32px;letter-spacing:4px;text-shadow:0 0 12px #4da3ff}#bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}.control{display:flex;align-items:center;gap:7px;background:#151c25;border:1px solid #33404d;border-radius:8px;padding:7px 9px;font-size:12px}input[type=range]{width:125px;accent-color:#4da3ff}button{padding:8px 13px;border:1px solid #455464;border-radius:8px;background:#151c25;color:#eee;font-family:inherit;font-weight:700;cursor:pointer}button:hover{background:#202b37}canvas{background:#182027;border:2px solid #465462;border-radius:10px;max-width:95vw;box-shadow:0 0 25px #000}.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:11px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:3px}.y{background:#ffd83d}.g{background:#35c759}.b{background:#4da3ff}.w{background:#777}.stats{font-size:12px}
</style></head><body><h1>SIMZ</h1><div id="bar"><button id="reset">RESET</button><button id="pause">PAUSE</button><label class="control">PEOPLE <input id="count" type="range" min="1" max="300" value="45"><output id="countVal">45</output></label><label class="control">INFECTION <input id="chance" type="range" min="0" max="100" value="12"><output id="chanceVal">12%</output></label><label class="control">DEFENCE <input id="defence" type="range" min="0" max="100" value="0"><output id="defenceVal">0%</output></label></div><canvas id="sim" width="900" height="600"></canvas><div class="legend"><span><i class="dot y"></i> healthy</span><span><i class="dot g"></i> infected zombie</span><span><i class="dot b"></i> defender</span><span><i class="dot w"></i> enterable buildings</span></div><div id="stats" class="stats"></div><script src="sim.js?v=5"></script></body></html>
